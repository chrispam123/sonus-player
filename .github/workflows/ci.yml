name: Sonus CI

# Triggers: PR to develop, or push to develop (after merge)
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build:
    name: Build, Lint & Sign
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Create secrets.properties (CI placeholder)
        run: |
          echo "LASTFM_API_KEY=" > secrets.properties
          echo "GENIUS_ACCESS_TOKEN=" >> secrets.properties

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/sonus-release.jks

      - name: Create keystore.properties for CI
        run: |
          echo "storeFile=/tmp/sonus-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build domain module
        run: ./gradlew :domain:build

      - name: Build data module
        run: ./gradlew :data:compileDebugKotlin

      - name: Build Release APK (signed)
        run: ./gradlew :app:assembleRelease

      - name: Run lint
        run: ./gradlew :app:lintDebug --continue || true
        continue-on-error: true

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sonus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
